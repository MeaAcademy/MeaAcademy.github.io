<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MEA Academy · Aulas</title>
  <meta name="description" content="Aulas da MEA Academy em formato visual, acessível e fácil de estudar.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <header class="topo">
    <div class="topo-in">
      <a class="marca" href="./"><span class="marca-logo">MEA</span>MEA Academy</a>
      <div class="ferramentas" id="ferramentas"></div>
    </div>
  </header>

  <main id="conteudo">
    <section class="home-hero">
      <div class="selos"><span class="selo">Material de aula</span></div>
      <h1>Suas aulas, claras e fáceis de estudar</h1>
      <p>Escolha uma aula para revisar as expressões, ouvir a pronúncia e acompanhar seu progresso.</p>
    </section>
    <div class="busca">
      <label class="sr-only" for="busca">Buscar aula</label>
      <input id="busca" type="search" placeholder="Buscar por semana, ciclo ou tema…">
    </div>
    <div class="grade-aulas" id="aulas" aria-live="polite"></div>
  </main>

  <footer class="rodape">MEA Academy</footer>

  <script src="assets/js/app.js"></script>
  <script>
    MEA.montarFerramentas("#ferramentas");
    const s = document.createElement("script");
    s.src = "aulas/lista.js?v=" + Date.now();
    s.onload = () => MEA.renderizarInicio();
    document.head.appendChild(s);
  </script>
</body>
</html>
